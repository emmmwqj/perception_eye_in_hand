# Outer-side simulation camera; metres; quaternion xyzw.
parameters:
  name: ur7e_d435_side_sim_mount
  calibration_type: eye_in_hand
  robot_base_frame: base_link
  robot_effector_frame: tool0
  tracking_base_frame: camera_color_optical_frame
  tracking_marker_frame: marker_0
  freehand_robot_movement: true
  move_group_namespace: /
  move_group: manipulator
transform:
  translation:
    x: -0.0325
    y: -0.075
    z: 0.0357
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
simulation_mount:
  description: Designed outer-side eye-in-hand fixture on tool0 -Y, away from base
    at the tall initial pose. Central tool axis stays free. Not a measured calibration.
  housing_center_xy:
  - 0
  - -0.075
  housing_front_z: 0.04
  housing_back_z: 0.014945
  optical_forward_axis: tool0 +Z
